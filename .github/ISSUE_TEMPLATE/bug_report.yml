name: Ошибка
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести?
      description: Команда, минимальные входные данные и фактический результат без секретов.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: 0.3.1
    validations:
      required: true
