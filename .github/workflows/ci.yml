name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q triz_protocol tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_markdown_links.py
      - name: Verify editable installation and entry point
        run: |
          python -m pip install --no-deps -e .
          triz --help
      - name: Validate examples
        run: |
          for example in examples/*/*.json; do
            python -m triz_protocol validate "$example"
          done
      - name: Run frozen context benchmark
        run: python -m triz_protocol benchmark benchmarks/context-funnel-v1/gold.json benchmarks/context-funnel-v1/result.example.json
      - name: Run frozen benchmark suite
        run: |
          python -m triz_protocol benchmark-suite benchmarks/suite-v1/suite.json benchmarks/suite-v1/results/baseline-demo --output baseline-score.json
          python -m triz_protocol benchmark-suite benchmarks/suite-v1/suite.json benchmarks/suite-v1/results/protocol-demo --output protocol-score.json
          python -m triz_protocol compare baseline-score.json protocol-score.json --output comparison.json
      - name: Prepare isolated experiment packets
        run: |
          python -m triz_protocol prepare-experiment benchmarks/suite-v1/suite.json experiment-ci --protocol-path skills/triz-problem-solving --pair-id ci-pair --model test-model --model-version test-version --decoding fixed
          test ! -e experiment-ci/baseline/protocol
          test -e experiment-ci/protocol/protocol/SKILL.md
