[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triz-agent-protocol"
version = "0.1.1"
description = "Model-agnostic, evidence-aware TRIZ protocol for AI-assisted problem solving"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TRIZ Agent Protocol contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering"
]

[project.scripts]
triz = "triz_protocol.cli:main"

[tool.setuptools]
packages = ["triz_protocol"]
